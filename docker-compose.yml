version: "3.9"

networks:
  merit-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  # ─────────────────── INFRASTRUCTURE ───────────────────
  postgres:
    image: postgres:15-alpine
    container_name: merit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - merit-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: merit-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - merit-net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: merit-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
    networks:
      - merit-net

  # ─────────────────── BACKEND SERVICES ───────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: merit-api-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - merit-net
    volumes:
      - ./services/api-gateway:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: merit-auth
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - merit-net

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: merit-user
    restart: unless-stopped
    env_file: .env
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - merit-net

  signal-engine:
    build:
      context: ./services/signal-engine
      dockerfile: Dockerfile
    container_name: merit-signal-engine
    restart: unless-stopped
    env_file: .env
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - merit-net
    volumes:
      - ./ml/models:/app/models

  market-data:
    build:
      context: ./services/market-data
      dockerfile: Dockerfile
    container_name: merit-market-data
    restart: unless-stopped
    env_file: .env
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - merit-net

  execution-engine:
    build:
      context: ./services/execution-engine
      dockerfile: Dockerfile
    container_name: merit-execution
    restart: unless-stopped
    env_file: .env
    ports:
      - "8005:8005"
    depends_on:
      risk-engine:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - merit-net

  risk-engine:
    build:
      context: ./services/risk-engine
      dockerfile: Dockerfile
    container_name: merit-risk
    restart: unless-stopped
    env_file: .env
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - merit-net

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: merit-notifications
    restart: unless-stopped
    env_file: .env
    ports:
      - "8007:8007"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - merit-net

  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: Dockerfile
    container_name: merit-admin
    restart: unless-stopped
    env_file: .env
    ports:
      - "8008:8008"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - merit-net

  # ─────────────────── FRONTEND ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: merit-frontend
    restart: unless-stopped
    env_file: ./frontend/.env.local
    ports:
      - "3000:3000"
    networks:
      - merit-net